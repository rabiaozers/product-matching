name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The unit tests need no data, no model and no PyTorch.
      - run: pip install pandas numpy scikit-learn faiss-cpu pytest
      - run: python -m pytest -q
